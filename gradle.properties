# ---------------------------------------------------------------------------
# JVM
# ---------------------------------------------------------------------------
# 6g because KSP + Room + Hilt annotation processing across 13 modules is
# memory hungry; the default 512m will OOM during :app:kspDebugKotlin.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# Build performance
# ---------------------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.incremental=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# Suppress the "not tested against this AGP" warning from experimental plugins.
android.suppressUnsupportedCompileSdk=

# ---------------------------------------------------------------------------
# OllamaMobile-specific build switches
# ---------------------------------------------------------------------------
# How :core-llm obtains its native libraries.
#
#   build     compile llama.cpp from third_party/llama.cpp via CMake.
#             Requires the NDK and the git submodule to be initialised.
#   prebuilt  consume .so files already present in core-llm/prebuilt/<abi>/.
#             Used by CI so ordinary PRs never pay the llama.cpp build cost.
#   none      no native code at all. NativeLlamaEngine is replaced by
#             StubLlamaEngine and BuildConfig.NATIVE_ENABLED is false, so the
#             app still builds and runs as a pure remote Ollama client.
#
# `none` is the default so a fresh clone builds with no NDK installed.
ollama.nativeSource=none

# Fail the build instead of silently degrading when native code is expected.
ollama.requireNative=false
