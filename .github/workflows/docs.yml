# Documentation site: build with MkDocs Material, publish to GitHub Pages.
#
# Pages is served from an Actions artifact (upload-pages-artifact + deploy-pages),
# not from a gh-pages branch. Nothing else in this repository may push to
# gh-pages: such a push would silently do nothing, because the branch is not the
# publishing source. See nightly-benchmark.yml for the same constraint.
#
# Pull requests build with --strict and stop there. A strict build fails on
# broken internal links and unknown config keys, which is the only automated
# proof we have that the docs tree is self-consistent.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR builds; never cancel a main build that may be mid-deploy.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # The docs tree lands in a separate stage of the build-out. Until mkdocs.yml
  # exists this workflow must no-op rather than fail, so that a red X here never
  # means "your change broke something". Delete this job once docs/ is permanent.
  guard:
    runs-on: ubuntu-latest
    # Checkout plus two `test -f`.
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        shell: bash
        run: |
          if [ -f mkdocs.yml ] && [ -f docs/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mkdocs.yml or docs/requirements.txt not present yet; skipping the docs build."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.present == 'true'
    runs-on: ubuntu-latest
    # pip install plus a static-site build. Generous; a docs build that takes
    # 15 minutes has stopped being a docs build.
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings to derive the site
      # base URL. Read is sufficient; write lives on the deploy job only.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A Pages deployment that has not finished in 10 minutes is stuck on
    # GitHub's side; failing frees the `github-pages` concurrency group for the
    # next commit instead of blocking it for six hours.
    timeout-minutes: 10
    # id-token is what lets deploy-pages exchange an OIDC token for the
    # short-lived deployment credential; without it the deploy 403s.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A Pages deployment cannot overlap with another. Queue instead of cancel:
    # cancelling mid-deploy can leave the site on a half-published commit.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
