#
# OllamaMobile version catalogue.
#
# Every version below was resolved against the live artefact repositories.
# When bumping, prefer a Dependabot PR so CI proves the change.
#
# Two pairings are load-bearing and must be changed together:
#   * kotlin  <-> compose compiler plugin  (same coordinate version)
#   * kotlin  <-> ksp                      (ksp trails kotlin; check the KSP
#                                           release notes before bumping kotlin)
#
[versions]
# --- Build toolchain -------------------------------------------------------
# AGP 9 is not optional: Hilt 2.60+ refuses to apply on AGP 8, and Gradle 9.6
# removed internal APIs that AGP 8.x still uses. The 8.x line is a dead end.
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
# Not a dependency this project declares. Netty arrives transitively on the
# tooling classpaths AGP adds to every Android module -- the three pure-JVM
# modules (:core-model, :core-llm-api, :core-llm-testing) resolve no netty at
# all, which is what identifies it as AGP's rather than ours. Old copies on
# those classpaths are what the OSV scan reports. See the floor applied in
# internal/KotlinAndroid.kt for what this number is and is not doing.
netty = "4.1.136.Final"
# JDK used to *run* Gradle and compile; bytecode target stays 17 for AGP.
javaToolchain = "21"
jvmTarget = "17"

# --- Android SDK levels ----------------------------------------------------
# compileSdk 37 is forced by our dependencies: androidx.core 1.19, lifecycle
# 2.11 and hilt-navigation-compose 1.4 all publish AAR metadata requiring it.
# The platform is installed as `platforms;android-37.0`, hence compileSdkMinor.
compileSdk = "37"
compileSdkMinor = "0"
# targetSdk stays at 36 deliberately: targeting 37 makes the runtime
# local-network permission mandatory, which would gate LAN discovery behind a
# prompt before the onboarding flow that explains it exists.
targetSdk = "36"
minSdk = "29"

# --- Native ----------------------------------------------------------------
ndk = "29.0.14206865"
cmake = "3.31.0"

# --- AndroidX / Compose ----------------------------------------------------
composeBom = "2026.06.01"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
splashscreen = "1.0.1"

# --- DI --------------------------------------------------------------------
hilt = "2.60.1"
hiltExt = "1.4.0"

# --- Persistence -----------------------------------------------------------
room = "2.8.4"
sqlite = "2.7.0"
datastore = "1.2.1"

# --- Platform --------------------------------------------------------------
work = "2.11.2"
biometric = "1.1.0"
profileinstaller = "1.4.1"

# --- Kotlin libraries ------------------------------------------------------
coroutines = "1.11.0"
serialization = "1.11.0"
immutable = "0.5.1"

# --- Networking ------------------------------------------------------------
okhttp = "5.4.0"
ktor = "3.5.2"

# --- UI rendering ----------------------------------------------------------
markdown = "0.43.0"
highlights = "1.1.0"
coil = "3.5.0"

# --- Logging ---------------------------------------------------------------
timber = "5.0.1"

# --- Testing ---------------------------------------------------------------
junitBom = "6.1.2"
junit4 = "4.13.2"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
benchmark = "1.4.1"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.16.1"
truth = "1.4.5"
konsist = "0.17.3"

# --- Quality ---------------------------------------------------------------
spotless = "8.9.0"
ktlint = "1.8.0"
composeRules = "0.6.4"
detekt = "2.0.0-alpha.6"
kover = "0.9.9"
dependencyAnalysis = "3.18.0"

[libraries]
